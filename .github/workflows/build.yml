name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # --stacktrace is omitted deliberately: a Gradle stack trace buries the
      # compiler's "e:" lines under ~150 lines of framework frames. On failure
      # the errors are re-printed at the end of the log instead.
      - name: Assemble debug APK
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log; then
            echo "::group::Compile errors"
            grep -E '^e: ' build.log | head -n 60 || echo "(no 'e:' lines found)"
            echo "::endgroup::"
            exit 1
          fi

      - name: Rename APK
        id: apk
        run: |
          set -euo pipefail
          src="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          dest="hillbros-video-${GITHUB_SHA::7}.apk"
          cp "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hillbros-video-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # A rolling release gives a direct .apk download link that installs on a
      # phone without a GitHub login or unzipping an artifact bundle.
      - name: Publish rolling release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="app-latest"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Hill Bros Video — latest build" \
              --notes "Debug build, automatically published from ${GITHUB_REF_NAME}. Install on Android by allowing 'install unknown apps' for your browser."
          fi
          gh release upload "$tag" "${{ steps.apk.outputs.path }}" --clobber

      # Verifies the R8/ProGuard configuration without blocking the debug
      # build that people actually install.
      - name: Assemble release APK (non-blocking)
        continue-on-error: true
        run: ./gradlew --no-daemon assembleRelease
